          type: integer
          maximum: 90
          minimum: 7
          default: 30
          title: Days
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskTrend'
        '422':
          description: Validation Error
