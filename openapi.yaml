      tags:
      - metrics
      summary: Get Api Exposure
      operationId: get_api_exposure_api_v1_metrics_appsec_api_exposure_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/v1/metrics/appsec/owasp:
    get:
      tags:
      - metrics
      summary: Get Owasp Posture
      description: 'Cross-source OWASP Top 10 posture.


        This is the rollup no OEM can produce. AppScan reports its own findings

        against OWASP; Imperva reports its own in its own vocabulary; API Security

        reports its own. None of them can answer "what is our estate''s combined

        OWASP exposure", because none of them sees the other two.


        Scoped with `tenant_filter` on every branch, exactly as the rest of the

        metrics surface is. The `unmapped` bucket is returned rather than hidden:

        it is the platform''s own coverage gap and an auditor should see it.'
      operationId: get_owasp_posture_api_v1_metrics_appsec_owasp_get
      security:
      - HTTPBearer: []
      parameters:
      - name: app
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: App
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/metrics/appsec/fix-rate:
    get:
      tags:
      - metrics
      summary: Get Fix Rate
      operationId: get_fix_rate_api_v1_metrics_appsec_fix_rate_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/v1/metrics/soc/slo:
