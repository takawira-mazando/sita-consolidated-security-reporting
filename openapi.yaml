        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Framework
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: sort_by
        in: query
        required: false
        schema:
          type: string
          default: due_date
          title: Sort By
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/compliance/evidence:
    get:
      tags:
      - compliance
      summary: Get Evidence
      operationId: get_evidence_api_v1_compliance_evidence_get
      security:
      - HTTPBearer: []
      parameters:
      - name: gap_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Gap Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/compliance/frameworks:
    get:
      tags:
      - compliance
      summary: List Frameworks
      description: 'Every regulatory framework assessed, with its applicability determination.


        Frameworks that do not bind the platform are returned with

        ``applicability: not_applicable`` and a stated rationale, so a considered

        determination is visible rather than implied by omission.'
      operationId: list_frameworks_api_v1_compliance_frameworks_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/v1/compliance/transfers:
    get:
      tags:
      - compliance
      summary: List Transfers
      description: 'Cross-border data transfer register: destinations without a mechanism on file.


        The working list for closing gap G-07. Every entry here is an external

        system the platform exchanges South African government data with where no

        data transfer agreement or prior authorisation has been recorded.'
      operationId: list_transfers_api_v1_compliance_transfers_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/v1/alerts:
    get:
      tags:
      - alerts
      summary: Get Alerts
      operationId: get_alerts_api_v1_alerts_get
      security:
      - HTTPBearer: []
      parameters:
      - name: severity
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Severity
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: source
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Source
      - name: since
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Since
      - name: department_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 64
            pattern: ^[a-zA-Z0-9_\-]+$
          - type: 'null'
          description: Filter by department within assigned scope
          title: Department Id
        description: Filter by department within assigned scope
      - name: branch_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 64
            pattern: ^[a-zA-Z0-9_\-]+$
          - type: 'null'
          description: Filter by branch within assigned scope
          title: Branch Id
        description: Filter by branch within assigned scope
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
