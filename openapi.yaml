openapi: 3.1.0
info:
  title: SITA Security Intelligence Platform API
  version: 1.0.0
paths:
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Login
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/demo-login:
    post:
      tags:
      - auth
      summary: Demo Login
      operationId: demo_login_api_v1_auth_demo_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DemoLoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/demo-accounts:
    get:
      tags:
      - auth
      summary: Demo Accounts
      operationId: demo_accounts_api_v1_auth_demo_accounts_get
      parameters:
      - name: department_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 64
            pattern: ^[a-zA-Z0-9_\-]+$
          - type: 'null'
          title: Department Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DemoAccount'
                title: Response Demo Accounts Api V1 Auth Demo Accounts Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/tenancy:
    get:
      tags:
      - auth
      summary: Tenancy Hierarchy
      description: 'National + provincial hierarchy for the login page.


        Department/branch/province names are public government information; this

        endpoint exists so authenticated users can pick the tenancy context to

        sign into. Access control still happens on the data itself via tenant_filter.


        Authentication is required: the org-chart is filtered to the caller''s

        assigned scope so a department-scoped caller sees only their department''s

        branches. This prevents unauthenticated/weak-signature tokens from

        harvesting the full estate org-chart (AppScan Weak JWT / BFLA findings).'
      operationId: tenancy_hierarchy_api_v1_auth_tenancy_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenancyResponse'
      security:
      - HTTPBearer: []
  /api/v1/auth/me:
    get:
      tags:
      - auth
      summary: Me
      operationId: me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/app__api__routers__auth__UserOut'
      security:
      - HTTPBearer: []
  /api/v1/auth/switch-tenant:
    post:
      tags:
      - auth
      summary: Switch Tenant
      description: 'Re-issue a token for a new tenancy scope without re-authenticating.


        The target must sit within the user''s admin-set entitlement; an empty body

        resets to the account''s default (stored) scope.


        Only admin and transversal-admin roles can switch tenants.


        Every switch is audited: it re-scopes a live session across tenant

        boundaries without re-authenticating, so it is the single highest-value

        event to have a signed, attributable record of.'
      operationId: switch_tenant_api_v1_auth_switch_tenant_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchTenantRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/risks:
    get:
      tags:
      - risks
      summary: Get Risks
      operationId: get_risks_api_v1_risks_get
      security:
      - HTTPBearer: []
      parameters:
      - name: app
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: App
      - name: bucket
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Bucket
      - name: date_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Date From
      - name: date_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Date To
      - name: department_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 64
            pattern: ^[a-zA-Z0-9_\-]+$
          - type: 'null'
          description: Filter by department within assigned scope
          title: Department Id
        description: Filter by department within assigned scope
      - name: branch_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 64
            pattern: ^[a-zA-Z0-9_\-]+$
          - type: 'null'
          description: Filter by branch within assigned scope
          title: Branch Id
        description: Filter by branch within assigned scope
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/risks/by-cluster:
    get:
      tags:
      - risks
      summary: Get Risks By Cluster
      description: 'Rank Treasury clusters by average fused risk (most vulnerable first).


        cluster_id/ministry_id are nullable reporting metadata derived from each

        row''s department_id; they never widen the tenant scope (tenant_filter still

        keys on department_id).'
      operationId: get_risks_by_cluster_api_v1_risks_by_cluster_get
      security:
      - HTTPBearer: []
      parameters:
      - name: date_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Date From
      - name: date_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Date To
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/risks/by-ministry:
    get:
      tags:
      - risks
      summary: Get Risks By Ministry
      description: Rank ministries by average fused risk (most vulnerable first).
      operationId: get_risks_by_ministry_api_v1_risks_by_ministry_get
      security:
      - HTTPBearer: []
      parameters:
      - name: cluster_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Cluster Id
      - name: date_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Date From
      - name: date_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Date To
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/risks/{app_name}/trend:
    get:
      tags:
      - risks
      summary: Get Risk Trend
      operationId: get_risk_trend_api_v1_risks__app_name__trend_get
      security:
