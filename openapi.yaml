      summary: Resolve Alert
      operationId: resolve_alert_api_v1_alerts__alert_id__resolve_patch
      security:
      - HTTPBearer: []
      parameters:
      - name: alert_id
        in: path
        required: true
        schema:
          type: string
          title: Alert Id
      responses:
