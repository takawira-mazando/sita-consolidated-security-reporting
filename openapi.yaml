      operationId: get_findings_api_v1_findings_get
      security:
      - HTTPBearer: []
      parameters:
      - name: app
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: App
      - name: severity
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Severity
      - name: category
        in: query
