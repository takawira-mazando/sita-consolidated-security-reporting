          - type: string
          - type: 'null'
          title: Category
      - name: owasp_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: OWASP Top 10 category id, e.g. A03
          title: Owasp Id
        description: OWASP Top 10 category id, e.g. A03
      - name: cwe_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Precise CWE identifier, e.g. CWE-89
          title: Cwe Id
        description: Precise CWE identifier, e.g. CWE-89
      - name: source
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Source
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: since
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Since
      - name: department_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 64
            pattern: ^[a-zA-Z0-9_\-]+$
          - type: 'null'
          description: Filter by department within assigned scope
          title: Department Id
        description: Filter by department within assigned scope
      - name: branch_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 64
            pattern: ^[a-zA-Z0-9_\-]+$
          - type: 'null'
          description: Filter by branch within assigned scope
          title: Branch Id
        description: Filter by branch within assigned scope
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          minimum: 1
          default: 50
          title: Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/findings/{finding_id}:
    get:
      tags:
      - findings
      summary: Get Finding
      operationId: get_finding_api_v1_findings__finding_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: finding_id
        in: path
        required: true
        schema:
          type: string
          title: Finding Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Finding'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/compliance:
    get:
      tags:
      - compliance
      summary: Get Compliance
      operationId: get_compliance_api_v1_compliance_get
      security:
      - HTTPBearer: []
      parameters:
      - name: framework
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^(popia|iso_27001|ect_act|rica|ncia|icasa_eca)$
          - type: 'null'
          title: Framework
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/compliance/gaps:
    get:
      tags:
      - compliance
      summary: Get Compliance Gaps
      operationId: get_compliance_gaps_api_v1_compliance_gaps_get
      security:
