      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Users Admin Users Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - admin
      summary: Create User
      description: "Create a new user with strict tenancy and Role-Based Access Control (RBAC) validation.\n\
        \nThis endpoint integrates the full SITA tenancy model (Provinces, Departments, Branches) \nand\
        \ enforces **Delegated Authority**. The caller may only create users whose roles and \nscope fall\
        \ strictly within their own administrative boundaries.\n\n### Delegated Authority (Hierarchical\
        \ Tiers)\n- **Tier 5 (Platform Operator / creator):** Role `operator`. National scope. Can create\
        \ the SITA superuser (`admin`) and peer `operator` accounts only (rotation). Nothing else.\n-\
        \ **Tier 4 (SITA Superuser):** Role `admin`. National scope. Can create `transversal-admin`, `exec`,\
        \ `compliance`, `sre`, `dept-admin`, `province-dept-admin`, `branch-admin` and the operational\
        \ roles — never a peer `admin` or an `operator`.\n- **Tier 3 (Transversal Admin):** Role `transversal-admin`.\
        \ Assigned scope (may be national). Can create `transversal-admin` (peer), `exec`, `compliance`,\
        \ `sre`, `dept-admin`, `province-dept-admin`, `branch-admin` and the operational roles within\
        \ its scope.\n- **Tier 2 (Department Admin):** Role `dept-admin` / `province-dept-admin`. Department/province\
        \ scope. Can create `branch-admin` (dept-admin only) and the operational roles within their assigned\
        \ departments/province.\n- **Tier 1 (Branch Admin):** Role `branch-admin`. Branch scope. Can create\
        \ the operational roles *only* within their assigned branch.\n- **Tier 0 (Service Ops):** Role\
        \ `sre`. Estate-wide scope, operational roles only (`soc`, `appsec`, `dbsec`, `province-soc-lead`,\
        \ `local-appsec`) — no admin tiers.\n\n### Payload Requirements\n- **Employee**: identified either\
        \ by `identifier_scheme` + `identifier_value`\n  (preferred — e.g. `persal` + an 8-digit PERSAL\
        \ number) or by `person_id`.\n  Supply exactly one form. Accounts can only be created for employees\n\
        \  imported from the HR system — there is no path for external or non-employee\n  users.\n- **email**:\
        \ Must match the HR employee's registered email.\n- **roles**: Must contain valid SITA roles.\n\
        - **department_ids**: Must contain valid department slugs (e.g., `home-affairs-digital`) if the\
        \ role requires department scoping.\n- **branch_ids**: If provided, must belong to the specified\
        \ department.\n\n### Three gates on provisioning\n1. **Delegation** (`can_manage`) — may the caller\
        \ grant this authority? Roles\n   must be strictly below the caller's tier and the granted scope\
        \ inside the\n   caller's own.\n2. **Tenancy** (`person_within_scope`) — is this the caller's\
        \ employee? The\n   HR record's department/branch must fall inside the caller's scope. This is\n\
        \   separate from gate 1: an in-scope grant does not make a foreign employee\n   in scope.\n3.\
        \ **Alignment** — a scoped account must sit in the employee's own department.\n\n### Security\n\
        - Requires `admin_write` permission.\n- Attempts to escalate privileges or scope will result in\
        \ `HTTP 403 Forbidden`."
      operationId: create_user_admin_users_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/app__api__routers__admin__UserOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
