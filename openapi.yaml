      tags:
      - metrics
      summary: Get Slo Metrics
      operationId: get_slo_metrics_api_v1_metrics_soc_slo_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /api/v1/metrics/sre/system:
    get:
      tags:
      - metrics
      summary: Get System Metrics
      description: 'System-level platform metrics. Requires admin_read capability.


        Distinct from /sre/agents which is a discovery endpoint — this returns

        internal platform health metrics and is therefore gated on admin_read

        rather than the sre convenience alias (AppScan BFLA path-manipulation fix).'
      operationId: get_system_metrics_api_v1_metrics_sre_system_get
      security:
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          description: Maximum metrics rows to return
          default: 100
          title: Limit
        description: Maximum metrics rows to return
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/metrics/sre/agents:
    get:
      tags:
