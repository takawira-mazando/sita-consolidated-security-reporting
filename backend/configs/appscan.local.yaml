# AppScan Cloud Connector Configuration - LOCAL DEVELOPMENT TEMPLATE
# ============================================================
# CWE-522: Real credentials MUST NOT appear in this file.
# Copy this template to appscan.local.secret.yaml (gitignored)
# and supply real values there, OR export them as environment variables:
#
#   export APPSCAN_API_KEY="<key_id>:<key_secret>"
#   export APPSCAN_KEY_ID="<key_id>"
#   export APPSCAN_KEY_SECRET="<key_secret>"
#   export APPSCAN_APPLICATION_ID="<app_uuid>"
#
# To use this template:
#   APPSCAN_CONFIG_PATH=configs/appscan.local.secret.yaml python fetch_appscan.py
# ============================================================

# AppScan Cloud base URL
base_url: "https://cloud.appscan.com"

# Authentication: Key ID and Key Secret (from AppScan Cloud Account > API Keys)
# TEMPLATE ONLY — replace with real values in appscan.local.secret.yaml (gitignored)
api_key: "${APPSCAN_API_KEY}"

# Alternative: separate fields
key_id: "${APPSCAN_KEY_ID}"
key_secret: "${APPSCAN_KEY_SECRET}"

# Account/Organization ID
account_id: ""

# Application ID
application_id: "${APPSCAN_APPLICATION_ID}"
application_name: "demo.testfire.net"

# Scope for issues query: 'application' (per-app) or 'org' (all apps in org)
scope: "application"

# Page size for pagination (max 200 per AppScan API)
page_size: 200

# Optional: Filter by last modified date (ISO 8601)
# last_modified_since: "2026-08-01T00:00:00Z"

# Optional: Specific severity filter (comma-separated)
# severity_filter: "critical,high"

# Optional: Status filter
# status_filter: "Open,In Progress"