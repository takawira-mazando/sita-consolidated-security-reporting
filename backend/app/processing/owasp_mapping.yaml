version: owasp-top10-2021
published: "2021"
title: OWASP Top 10 - 2021

categories:
  A01:
    name: Broken Access Control
    summary: >-
      Access controls enforce policy so users cannot act outside their intended
      permissions. Failures include broken object level authorisation, forced
      browsing, insecure direct object references and privilege escalation.
  A02:
    name: Cryptographic Failures
    summary: >-
      Previously titled Sensitive Data Exposure. Failures to properly implement
      cryptography, or the use of weak or default algorithms and keys.
  A03:
    name: Injection
    summary: >-
      Data sent to an interpreter is treated as code. SQL, NoSQL, OS command,
      LDAP, ORM and XPath injection all sit here, as do XSS and file inclusion.
  A04:
    name: Insecure Design
    summary: >-
      A weakness in the design of the application, not its implementation.
      Threat modelling and secure design patterns cannot be retrofitted.
  A05:
    name: Security Misconfiguration
    summary: >-
      Insecure defaults, incomplete hardening, unnecessary features and error
      messages that disclose more than they should.
  A06:
    name: Vulnerable and Outdated Components
    summary: >-
      Known flaws in libraries, frameworks and platforms, or components the
      organisation did not test or keep current.
  A07:
    name: Identification and Authentication Failures
    summary: >-
      Weaknesses in confirming identity. Credential stuffing, weak passwords,
      missing MFA and permissive session lifetimes.
  A08:
    name: Software and Data Integrity Failures
    summary: >-
      Trusting updates, plugins, serialised data or CI/CD artefacts without
      integrity verification. Includes insecure deserialisation.
  A09:
    name: Security Logging and Monitoring Failures
    summary: >-
      Logins, failures and other high-value events are not logged, monitored
      or alerted on sufficiently to detect and respond to an attack.
  A10:
    name: Server-Side Request Forgery
    summary: >-
      An attacker supplies a URL that a server-side component fetches, reaching
      internal services the caller could not otherwise address.

# Sources whose category vocabulary is not a software vulnerability class.
# Classifying these would be a category error: a POPIA consent gap is an
# assurance obligation, not an OWASP category, and a DAM SQL statement type is
# an operation, not a weakness.
exempt_sources:
  - compliance

rules:
  appscan:
    "a01-broken-access-control": A01
    "a02-crypto-failures": A02
    "a03-injection": A03
    "a04-insecure-design": A04
    "a07-identification-auth-failures": A07
    "a09-security-logging-failures": A09
    "a10-ssrf": A10
    "broken access control": A01
    "cryptographic failures": A02
    "injection": A03
    "insecure design": A04
    "security misconfiguration": A05
    "vulnerable components": A06
    "authentication failures": A07
    "software integrity failures": A08
    "logging failures": A09
    "ssrf": A10
    # seed-demo.sql vocabulary
    sqli: A03
    xss: A03
    rce: A03
    lfi: A03
    rfi: A03
    xxe: A05
    idor: A01
    path_traversal: A01
    info_disclosure: A01
    broken_auth: A07
    misconfig: A05

  imperva_dam:
    unauth_access: A01
    privilege_abuse: A01
    data_exfil: A01
    sql_injection: A03
    exfil: A01

  imperva_waf:
    sqli: A03
    sql_injection: A03
    xss: A03
    rce: A03
    lfi: A03
    rfi: A03
    shellshock: A03
    brute-force: A07
    brute_force: A07
    crlf: A03

  apisec:
    shadow_api: A05
    rate_limit: A04
    auth_missing: A07
    data_overexposure: A01

  thales:
    database_security: A01
    privilege_escalation: A01

