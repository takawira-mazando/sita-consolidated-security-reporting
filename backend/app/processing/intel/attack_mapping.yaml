# CWE -> MITRE ATT&CK technique map, and alert rule -> technique map.
#
# Curated data, not generated. A reviewer diffs it; a model does not write it.
# Version it the way owasp_mapping.yaml is versioned, so a change is visible in
# code review.
#
# Two directions:
#   cwe_techniques  - what a finding's weakness class means in attack terms.
#                     This is the "red" side: what an attacker could do.
#   rule_techniques - which ATT&CK techniques the platform's own alert rules
#                     can evidence. This is the "blue" side: what we would notice.
#                     The gap between the two sets is the deliverable.

version: attack-v1
attack_release: "enterprise-attack"

cwe_techniques:
  "89":                      # SQL injection
    - T1190                  # Exploit Public-Facing Application
  "79":                      # Cross-site scripting
    - T1189                  # Drive-by Compromise
  "22":                      # Path traversal
    - T1083                  # File and Directory Discovery
    - T1190
  "78":                      # OS command injection
    - T1059                  # Command and Scripting Interpreter
    - T1190
  "77":                      # Command injection (variant)
    - T1059
  "94":                      # Code injection
    - T1059
  "918":                     # Server-side request forgery
    - T1190
  "611":                     # XML external entity
    - T1204                  # User Execution
    - T1190
  "352":                     # Cross-site request forgery
    - T1189
  "798":                     # Hard-coded credentials
    - T1078                  # Valid Accounts
  "287":                     # Improper authentication
    - T1078
    - T1110                  # Brute Force
  "502":                     # Deserialisation of untrusted data
    - T1204
  "434":                     # Unrestricted file upload
    - T1105                  # Ingress Tool Transfer
  "22 ":                     # guard: unquoted keys are dropped, not matched
    []
  "306":                     # Missing authentication for critical function
    - T1078
  "732":                     # Incorrect permission assignment
    - T1222                  # File and Directory Permissions Modification
  "16 ":                     # guard
    []
  "200":                     # Exposure of sensitive information
    - T1552                  # Unsecured Credentials
  "522":                     # Insufficiently protected credentials
    - T1552
  "311":                     # Missing encryption of sensitive data
    - T1552
  "400":                     # Uncontrolled resource consumption
    - T1499                  # Endpoint Denial of Service
  "770":                     # Allocation without limits
    - T1499

# Techniques the platform's own alerting can evidence, keyed by the rule ids
# already defined in alert_rules.yaml. alert_rules.yaml is NOT modified — this
# map is the side table, so adding a rule never rewrites the rule file.
rule_techniques:
  critical_record:
    - T1190
    - T1189
  high_imperva_dam:
    - T1190
    - T1059
  appscan_high:
    - T1190
    - T1189
  risk_critical:
    - T1190
  new_critical_cve:
    - T1190
  shadow_api:
    - T1190
  compliance_drop: []
  imperva_spike:
    - T1499
  connector_auth_failure: []

# Column predicates used to build a retrospective hunt query, per technique.
# Keyed to columns that actually exist on the warehouse tables; a technique with
# no binding here produces a "manual hunt" card rather than a fabricated query.
hunt_sources:
  T1190:
    table: waf_blocks
    time_column: block_time
    category_column: attack_type
    uri_column: request_uri
    indicators: ["sqli", "xss", "traversal", "rce", "injection"]
  T1083:
    table: waf_blocks
    time_column: block_time
    category_column: attack_type
    uri_column: request_uri
    indicators: ["traversal", "lfi", "rfi"]
  T1059:
    table: waf_blocks
    time_column: block_time
    category_column: attack_type
    uri_column: request_uri
    indicators: ["rce", "command"]
  T1078:
    table: findings
    time_column: last_seen
    category_column: category
    uri_column: app_name
    indicators: ["auth", "credential", "password", "login"]
  T1552:
    table: findings
    time_column: last_seen
    category_column: category
    uri_column: app_name
    indicators: ["hardcoded", "exposure", "sensitive"]
  T1189:
    table: waf_blocks
    time_column: block_time
    category_column: attack_type
    uri_column: request_uri
    indicators: ["xss"]
  T1499:
    table: waf_blocks
    time_column: block_time
    category_column: attack_type
    uri_column: request_uri
    indicators: ["scan", "flood", "dos"]