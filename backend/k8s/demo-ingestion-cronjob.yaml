apiVersion: batch/v1
kind: CronJob
metadata:
  name: demo-ingestion
  namespace: sita-platform
  labels:
    app: sita-platform
    component: ingestion
    type: demo
spec:
  schedule: "*/15 * * * *"          # Every 15 minutes for demo (more frequent)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 180
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app: sita-platform
            component: ingestion
            type: demo
          annotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "8000"
            prometheus.io/path: "/metrics"
        spec:
          serviceAccountName: sita-ingestion
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
          initContainers:
          - name: wait-for-db
            image: busybox:1.36
            command: ['sh', '-c', 'until nc -z postgres 5432; do echo "Waiting for DB..."; sleep 2; done']
          containers:
          - name: ingest
            image: ${IMAGE_REGISTRY}/sita-backend:${IMAGE_TAG:-latest}
            imagePullPolicy: Always
            command:
            - python
            - -m
            - scripts.demo_ingestion
            - --all
            - --json-logs
            env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: LOG_LEVEL
              value: "INFO"
            envFrom:
            - secretRef:
                name: demo-oem-secrets
                optional: false
            - configMapRef:
                name: demo-ingestion-config
                optional: false
            resources:
              requests:
                cpu: "200m"
                memory: "256Mi"
              limits:
                cpu: "1000m"
                memory: "1Gi"
            livenessProbe:
              exec:
                command: ["python", "-c", "import sys; sys.exit(0)"]
              initialDelaySeconds: 30
              periodSeconds: 60
          volumes:
          - name: demo-data
            configMap:
              name: demo-compliance-data
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-ingestion-config
  namespace: sita-platform
  labels:
    app: sita-platform
    component: ingestion
    type: demo
data:
  # Base configuration - secrets come from Secret
  DEMO_APPSCAN_BASE_URL: "https://cloud.appscan.com"
  DEMO_APPSCAN_PAGE_SIZE: "200"
  DEMO_APPSCAN_SCOPE: "application"
  DEMO_IMPERVA_DAM_SOURCE_TYPE: "dam"
  DEMO_IMPERVA_WAF_SOURCE_TYPE: "waf"
  DEMO_APISEC_BASE_URL: "https://api.demo.apisec.ai"
  DEMO_COMPLIANCE_SOURCE_TYPE: "csv"
  DEMO_COMPLIANCE_CSV_PATH: "/app/data/demo_compliance.csv"
---
apiVersion: v1
kind: Secret
metadata:
  name: demo-oem-secrets
  namespace: sita-platform
  labels:
    app: sita-platform
    component: ingestion
    type: demo
type: Opaque
stringData:
  # APPSCAN - Fill in from OEM test account
  DEMO_APPSCAN_KEY_ID: ""
  DEMO_APPSCAN_KEY_SECRET: ""
  DEMO_APPSCAN_ACCOUNT_ID: ""
  # DEMO_APPSCAN_APPLICATION_ID: ""

  # IMPERVA DAM - Fill in from OEM test account
  DEMO_IMPERVA_DAM_BASE_URL: ""
  DEMO_IMPERVA_DAM_API_KEY: ""

  # IMPERVA WAF - Fill in from OEM test account
  DEMO_IMPERVA_WAF_BASE_URL: ""
  DEMO_IMPERVA_WAF_API_KEY: ""

  # APISEC - Fill in from OEM test account
  DEMO_APISEC_BASE_URL: ""
  DEMO_APISEC_API_KEY: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-compliance-data
  namespace: sita-platform
  labels:
    app: sita-platform
    component: ingestion
    type: demo
data:
  demo_compliance.csv: |
    framework,control_id,domain,description,owner,severity,due_date,status,evidence_count
    POPIA,POPIA-5.1,Data Processing,Lawful basis for processing not documented,Privacy Office,high,2026-09-01,open,0
    POPIA,POPIA-10.1,Data Subject Rights,Automated decision making not disclosed,Legal,medium,2026-09-15,open,0
    ISO27001,A.12.6.1,Technical Vulnerabilities,Vulnerability management process incomplete,InfoSec,critical,2026-08-30,open,0
    ISO27001,A.8.1.1,Asset Inventory,Asset inventory incomplete,IT Ops,high,2026-09-10,in_progress,2
    PCI-DSS,6.5.6,Injection,SQL injection protection not validated,AppSec,high,2026-09-05,open,0
    PCI-DSS,8.2.3,Authentication,MFA not enforced for all admin access,Identity,critical,2026-08-25,open,0
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sita-ingestion
  namespace: sita-platform
  labels:
    app: sita-platform
    component: ingestion
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sita-ingestion
  namespace: sita-platform
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sita-ingestion
  namespace: sita-platform
subjects:
- kind: ServiceAccount
  name: sita-ingestion
  namespace: sita-platform
roleRef:
  kind: Role
  name: sita-ingestion
  apiGroup: rbac.authorization.k8s.io