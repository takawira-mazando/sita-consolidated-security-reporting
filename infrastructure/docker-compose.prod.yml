version: "3.9"

x-logging: &logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sita
      POSTGRES_USER: sita
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
      - pg_wal:/var/lib/postgresql/pg_wal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sita -d sita"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
    logging: *logging

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    logging: *logging

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://sita:${DB_PASSWORD}@postgres:5432/sita
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: 587
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL}
      PAGERDUTY_ROUTING_KEY: ${PAGERDUTY_ROUTING_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
    logging: *logging

  ingestion:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: python -m app.entrypoints.ingestion
    environment:
      DATABASE_URL: postgresql+asyncpg://sita:${DB_PASSWORD}@postgres:5432/sita
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G
          cpus: "0.5"
    logging: *logging

  processing:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: python -m app.entrypoints.processing
    environment:
      DATABASE_URL: postgresql+asyncpg://sita:${DB_PASSWORD}@postgres:5432/sita
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      PROCESSING_BATCH_SIZE: 200
      PROCESSING_CONSUMERS: 8
      PROCESSING_MAX_CONCURRENT_EVALS: 32
      DB_POOL_SIZE: 20
      DB_MAX_OVERFLOW: 40
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 3
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    logging: *logging

  dispatch:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: python -m app.entrypoints.dispatch
    environment:
      DATABASE_URL: postgresql+asyncpg://sita:${DB_PASSWORD}@postgres:5432/sita
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: 587
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL}
      PAGERDUTY_ROUTING_KEY: ${PAGERDUTY_ROUTING_KEY}
      DISPATCH_MAX_WORKERS: 20
      DISPATCH_CONSUMERS: 2
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    logging: *logging

  analytics:
    build:
      context: ../backend
      dockerfile: Dockerfile
    command: python -m app.entrypoints.analytics
    environment:
      DATABASE_URL: postgresql+asyncpg://sita:${DB_PASSWORD}@postgres:5432/sita
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    logging: *logging

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.2"
    logging: *logging

  nginx:
    image: nginx:1.25-alpine
    volumes:
      - ./nginx/sita.conf:/etc/nginx/conf.d/sita.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.2"
    logging: *logging

volumes:
  pgdata:
  pg_wal:
  redis_data:
