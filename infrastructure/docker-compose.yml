version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sita
      POSTGRES_USER: sita
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    # Port 5432 not exposed externally - only accessible within Docker network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sita -d sita"]
      interval: 10s
      timeout: 5s
      retries: 5
    # CWE-400: resource limits prevent container DoS
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    # CWE-266: no privilege escalation allowed
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-password}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    # CWE-400: resource limits
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp

  backend:
    build: ../backend
    environment:
      DATABASE_URL: postgresql+asyncpg://sita:${DB_PASSWORD:-password}@postgres:5432/sita
      REDIS_URL: redis://:${REDIS_PASSWORD:-password}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /run
    develop:
      watch:
        - path: ../backend
          action: rebuild

  ingestion:
    build: ../backend
    command: python -m app.entrypoints.ingestion
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-password}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    security_opt:
      - no-new-privileges:true

  processing:
    build: ../backend
    command: python -m app.entrypoints.processing
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-password}@redis:6379/0
      DATABASE_URL: postgresql+asyncpg://sita:${DB_PASSWORD:-password}@postgres:5432/sita
      PROCESSING_BATCH_SIZE: 100
      PROCESSING_CONSUMERS: 4
      PROCESSING_MAX_CONCURRENT_EVALS: 20
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    security_opt:
      - no-new-privileges:true

  dispatch:
    build: ../backend
    command: python -m app.entrypoints.dispatch
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-password}@redis:6379/0
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
      PAGERDUTY_ROUTING_KEY: ${PAGERDUTY_ROUTING_KEY:-}
      DISPATCH_MAX_WORKERS: 10
      DISPATCH_CONSUMERS: 2
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    security_opt:
      - no-new-privileges:true

  analytics:
    build: ../backend
    command: python -m app.entrypoints.analytics
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-password}@redis:6379/0
      DATABASE_URL: postgresql+asyncpg://sita:${DB_PASSWORD:-password}@postgres:5432/sita
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    security_opt:
      - no-new-privileges:true

  frontend:
    build: ../frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
      - /var/cache/nginx

volumes:
  pgdata:
  redis_data:
