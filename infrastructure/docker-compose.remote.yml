version: "3.9"

x-logging: &logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sita
      POSTGRES_USER: sita
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./scripts/seed-hr-system.sql:/docker-entrypoint-initdb.d/02-seed-hr.sql
      - ./scripts/seed-hr-system-branches.sql:/docker-entrypoint-initdb.d/03-seed-hr-branches.sql
      - pg_wal:/var/lib/postgresql/pg_wal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sita -d sita"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    logging: *logging

  backend:
    image: ghcr.io/takawira-mazando/sita-backend:latest
    environment:
      DATABASE_URL: postgresql+asyncpg://sita:${DB_PASSWORD}@postgres:5432/sita
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      ENVIRONMENT: production
      JWT_SECRET: ${JWT_SECRET:?set a strong JWT_SECRET in .env}
      SEED_DEMO_USERS_ENABLED: "false"
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@example.com}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?set a strong BOOTSTRAP_ADMIN_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *logging

  frontend:
    image: ghcr.io/takawira-mazando/sita-frontend:latest
    depends_on:
      - backend
    logging: *logging

  nginx:
    image: nginx:1.25-alpine
    volumes:
      - ./nginx/sita-http.conf:/etc/nginx/conf.d/sita.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    logging: *logging

volumes:
  pgdata:
  pg_wal:
  redis_data: